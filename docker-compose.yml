services:
  postgres_tyres:
    image: postgres:15
    env_file: ./.env
    environment:
      POSTGRES_USER: ${TYRES_DB_USER}
      POSTGRES_PASSWORD: ${TYRES_DB_PASSWORD}
      POSTGRES_DB: ${TYRES_DB_NAME}
    volumes:
      - tyre_data:/var/lib/postgresql/data
      - ./postgres-init-tyres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TYRES_DB_USER} -d ${TYRES_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - labnet

  postgres_users:
    image: postgres:15
    env_file: ./.env
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    volumes:
      - users_data:/var/lib/postgresql/data
      - ./postgres-init-users:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - labnet

  postgres_orders:
    image: postgres:15
    env_file: ./.env
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD}
      POSTGRES_DB: ${ORDERS_DB_NAME}
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDERS_DB_USER} -d ${ORDERS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - labnet

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports:
      # management UI, reachable only from this machine
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - labnet

  tyres_service:
    image: ghcr.io/andrewfoxatu/cicd2-tyres-service/tyres_service:latest
    env_file: ./.env
    environment:
      POSTGRES_HOST: ${TYRES_DB_HOST}
      POSTGRES_PORT: ${TYRES_DB_PORT}
      POSTGRES_DB: ${TYRES_DB_NAME}
      POSTGRES_USER: ${TYRES_DB_USER}
      POSTGRES_PASSWORD: ${TYRES_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RETAIL_MARKUP: ${RETAIL_MARKUP:-1.35}
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres_tyres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    networks:
      - labnet

  users_service:
    image: ghcr.io/andrewfoxatu/cicd2-users-service/users_service:latest
    env_file: ./.env
    environment:
      POSTGRES_HOST: ${USERS_DB_HOST}
      POSTGRES_PORT: ${USERS_DB_PORT}
      POSTGRES_DB: ${USERS_DB_NAME}
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres_users:
        condition: service_healthy
    ports:
      - "127.0.0.1:8003:8000"
    restart: unless-stopped
    networks:
      - labnet

  orders_service:
    image: ghcr.io/andrewfoxatu/cicd2-orders-service/orders_service:latest
    env_file: ./.env
    environment:
      ORDERS_DB_HOST: ${ORDERS_DB_HOST}
      ORDERS_DB_PORT: ${ORDERS_DB_PORT}
      ORDERS_DB_NAME: ${ORDERS_DB_NAME}
      ORDERS_DB_USER: ${ORDERS_DB_USER}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}

      TYRES_SERVICE_URL: ${TYRES_SERVICE_BASE_URL}
      USERS_SERVICE_URL: ${USERS_SERVICE_BASE_URL}
      RABBIT_URL: amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres_orders:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tyres_service:
        condition: service_started
      users_service:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    networks:
      - labnet


  notifications_service:
    image: ghcr.io/andrewfoxatu/cicd2-notifications-service/notifications_service:latest
    env_file: ./.env
    environment:
      RABBIT_URL: amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672/
    command: ["python", "-m", "app.notifications_worker"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      users_service:
        condition: service_started
      tyres_service:
        condition: service_started
    restart: unless-stopped
    networks:
      - labnet

  tyres_rpc_worker:
    image: ghcr.io/andrewfoxatu/cicd2-tyres-service/tyres_service:latest
    env_file: ./.env
    environment:
      RABBIT_URL: amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672/
      POSTGRES_HOST: ${TYRES_DB_HOST}
      POSTGRES_PORT: ${TYRES_DB_PORT}
      POSTGRES_DB: ${TYRES_DB_NAME}
      POSTGRES_USER: ${TYRES_DB_USER}
      POSTGRES_PASSWORD: ${TYRES_DB_PASSWORD}
    command: ["python", "-m", "app.tyre_rpc_worker"]
    depends_on:
      postgres_tyres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - labnet

  users_rpc_worker:
    image: ghcr.io/andrewfoxatu/cicd2-users-service/users_service:latest
    env_file: ./.env
    environment:
      RABBIT_URL: amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672/
      POSTGRES_HOST: ${USERS_DB_HOST}
      POSTGRES_PORT: ${USERS_DB_PORT}
      POSTGRES_DB: ${USERS_DB_NAME}
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
    command: ["python", "-m", "app.user_rpc_worker"]
    depends_on:
      postgres_users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - labnet

  frontend:
    image: ghcr.io/andrewfoxatu/cicd2-frontend/frontend:latest
    env_file:
      - ./.env
    ports:
      # reachable from other devices on the shop network; change to
      # "127.0.0.1:3000:3000" to restrict to this machine only
      - "3000:3000"
    depends_on:
      - users_service
      - tyres_service
    restart: unless-stopped
    networks:
      - labnet



networks:
  labnet:

volumes:
  tyre_data:
  users_data:
  orders_data:
  rabbit_data:
